name: FocusTube

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.quantdale
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  indentWidth: 4
  tabWidth: 4

configs:
  Debug: debug
  Release: release

packages:
  FocusTubeCore:
    path: .
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    exactVersion: 0.4.8
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.0.0

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    GENERATE_INFOPLIST_FILE: NO

schemes:
  FocusTube:
    build:
      targets:
        FocusTube: all
        FocusTubeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: FocusTubeUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: Release


targets:
  FocusTube:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FocusTubeCore
      - package: YouTubeKit
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantdale.FocusTube
        PRODUCT_NAME: FocusTube
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/Info.plist

  FocusTubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FocusTubeUITests
    dependencies:
      - target: FocusTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantdale.FocusTubeUITests
        TEST_TARGET_NAME: FocusTube
