convergence_2026_08_25:
  red_gate_root_cause: >
    iOS CI runs since the DDV2 wave displayed green test steps while the final
    Gate failed (run 32712931724 at aebae44, gate message unit=65 ui=65). The
    two bounded test steps carry continue-on-error so both bundles always run
    and diagnostics always publish; the Gate honestly restores the verdict from
    Artifacts/unit.exit and ui.exit. The aggregate logic was NEVER defective —
    the handoff claim of an orchestration bug was wrong; real product/test
    failures were hiding behind green step badges.
  unit_failures_fixed: >
    DownloadService promotion double-counted a promoted job in promotingIDs
    after admission (the persisted .resolving record already carries the slot),
    so a settled sibling could never promote while a promoted transfer ran:
    DurableQueueTests.testSettlePromotesOldestQueuedJobFirstAndExactlyOnce and
    DownloadServiceTests.testCancelFreesSlotAndPromotesQueuedDownload. Fix:
    promotingIDs.remove(id) at admission; cancel-frees-slot test rewritten to
    fill BOTH slots before expecting deferral.
  ui_failures_fixed: >
    Five journeys failed on taller DDV2 layouts because synthesized swipe
    gestures do not reliably scroll on the iOS 26 simulator (window band
    {{0,135.5},{402,603}}), exposing controls below the fold for the first
    time. Reveal machinery now rotates three gesture strategies (container
    element swipe, explicit coordinate press-drag with momentum, app swipe),
    records frame breadcrumbs + container size in failure traces, and may use
    one clamped last-resort coordinate tap for tap-probes whose stable frame is
    inside the physical screen — observable post-conditions remain the verdict.
    Journey E now asserts label/enabled/rendered contracts without requiring
    gesture scroll; journeys G/L synchronize with transfer settlement before
    switching tabs; journey K scrolls the composer back into view before typing
    the reply.
  ci_hardening: scripts/ci/verify-gate-contract.sh wired into ios-ci.yml as a
    structural regression guard asserting the fail-closed verdict restoration.
  final_root_causes_closed_2026_08_25: >
    The remaining red-gate layer beneath the above: (1) FixtureMediaFactory
    lost writer.finishWriting() in the aebae44 rewrite — generation failed
    deterministically on every runner and the opaque-filler fallback registered
    fake completed downloads; fixed + unit-pinned (FixtureMediaTests) and the
    fallback replaced by a typed transport failure. (2) Search submit/focus:
    programmatic blur of any kind left the field un-refocusable by tap on this
    runtime; contract is now retain-focus + .scrollDismissesKeyboard(.immediately)
    over a deliberate NON-lazy results surface, with keyboard-aware harness
    scrolling/dismissal retries. (3) Journey L's fixture clip was 1.5 s —
    natural end-of-stream paused playback before observation; clip is 12 s and
    the local sheet owns a dedicated PlayerCoordinator. Full detail:
    .agent/checkpoints/20260825-DDV2-SYSTEMIC-CONVERGENCE.md.

ddv2_findings_ddv2_00:
  queued_download_durability: CONFIRMED_DEFECT — capacity-deferred requests were
    persisted `.queued` while promotion state lived only in DownloadService's
    process-memory `pendingRequests`; after relaunch the record had no promotion
    path AND counted toward activeLogicalCount, so two stranded rows could
    permanently deadlock all download admission. Fixed in DDV2-01.
  comment_write_gap: CONFIRMED_ABSENT (audit pending in DDV2-03) — YouTubeDataClient
    exposes commentThreads.list only; docs/04 and G6 claim insert paths.
  hb013_hb014: OPEN in backlog while STATE previously claimed no open debt —
    contradiction recorded; closure scheduled DDV2-09 or earlier en route.
  historical_note: >
    FINAL_COMPLETION_V1 (2026-08-23) re-established repository truth before
    owner validation: iOS CI had silently failed on every push since the
    fixture-journey expansion, despite durable-state claims. Root causes were
    found and fixed as product defects (see
    .agent/checkpoints/20260823-FINAL-COMPLETION.md): modal sheet presentation
    of AVKit content never reached the accessibility hierarchy on iOS 26
    (video page is now a pushed route), LibraryStore was not observable
    (frontmost lists never live-updated), player overlays could inflate their
    List row, and fixture download admission depended on host-disk capacity.
    Full matrix green again at 42f761a. All agent-actionable engineering is
    complete; remaining items require the owner's physical iPhone and
    Google/Apple account setup plus an authenticated gh CLI (or manual UI
    click) for the opt-in live_smoke dispatch.

