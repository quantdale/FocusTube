  id: WP005-W1
  objective: Make downloads durable across suspension, interruption, relaunch, retry, and signed-URL expiration.
  exact_next_action: Persist DownloadTask records (SwiftData metadata + filesystem) behind a DownloadManager that reconciles on relaunch, implements retry/re-resolution, refuses on insufficient storage, and cleans up on cancel/failure without orphaning. Add deterministic state-machine reconciliation tests.
