current_waypoint:
  id: DDV2-01_DURABLE_QUEUE
  objective: >
    Repair durable queued-download recovery: queued jobs survive process death;
    queue reconstructed from persisted `.queued` records (FIFO by createdAt);
    planning metadata persisted WITHOUT signed media URLs; promotion stays FIFO
    and bounded (max 2); duplicate admission impossible; queued cancel deletes
    the record; corrupt/legacy rows degrade to typed recoverable failure
    (`queueStateCorrupted`); relaunch with actives+queued settles correctly.
  acceptance_evidence:
    - FocusTubeTests/DurableQueueTests.swift (8 tests) covering the 10 required scenarios
    - Core DownloadQueuePolicyTests green locally on Windows (81 XCTest + 11 swift-testing)
    - iOS CI (build Debug/Release + unit + UI journeys + gate) green on the packet commit
    - docs/03 durable-queue section added; STATE/WAYPOINTS updated
  validation_required:
    - device evidence A1-A14 (owner)
    - live smoke run result (one manual dispatch)
    - no Critical/High defect open at close

