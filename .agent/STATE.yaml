current_waypoint:
  id: INTEGRATION-A
  objective: >
    Reject overstated durable state. Audit found real defects: PlayerCoordinator
    class closes prematurely after playLocalFile (compile regression);
    DownloadManager.syncRecord is non-async yet awaits coordinator.task (Swift 6
    error); URLSessionDownloadTransport is a foreground .shared placeholder with
    a no-op cancel (not the locked background architecture); DownloadService.
    selectStream only uses media.combined and silently falls back 1080->720;
    final media is written under NSTemporaryDirectory (not durable Application
    Support); no download progress UI / real end-to-end wiring exists.
  exact_next_action: >
    PHASE A: fix PlayerCoordinator brace regression and DownloadManager.
    syncRecord concurrency; regenerate project; get FocusTubeCore + iOS build
    green on CI. Then PHASE C: implement real BackgroundDownloadTransport (
    URLSession.background, stable id, delegate-driven, cancel, retry, reconcile),
    wire component-aware DownloadCoordinator + native AVFoundation mux into
    DownloadService with exact-quality semantics, move final media to Application
    Support, add download progress UI, and validate end-to-end on the simulator.
  validation_required:
    - swift test (FocusTubeCore) green on CI and on local Windows Swift if present
    - XcodeGen generation succeeds
    - iOS app builds and launches on simulator
    - FocusTubeTests (coordinator/manager/mux/player/library) green
    - real background URLSession download validated
    - adaptive 1080p path actually used and validated
    - permanent Application Support storage validated
    - Shorts firewall intact
    - no known Critical/High defect

