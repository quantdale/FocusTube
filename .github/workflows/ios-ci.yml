name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only run one iOS CI at a time; new pushes cancel older in-progress runs.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Test FocusTubeCore
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project FocusTube.xcodeproj -scheme FocusTube

      - name: Select and boot simulator
        run: |
          UDID="$(bash scripts/ci/select-simulator.sh | tail -n 1)"
          echo "FOCUSTUBE_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Compile-only pass: catches Swift errors fast without simulator overhead.
      - name: Build (Debug)
        run: |
          mkdir -p Artifacts
          set -o pipefail
          xcodebuild build             -project FocusTube.xcodeproj             -scheme FocusTube             -destination "platform=iOS Simulator,id=${FOCUSTUBE_SIMULATOR_UDID}"             CODE_SIGNING_ALLOWED=NO 2>&1 | tee Artifacts/xcodebuild-build.log

      # Full test pass: builds test bundles and runs them on the simulator.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test             -project FocusTube.xcodeproj             -scheme FocusTube             -destination "platform=iOS Simulator,id=${FOCUSTUBE_SIMULATOR_UDID}"             -resultBundlePath Artifacts/FocusTube.xcresult             CODE_SIGNING_ALLOWED=NO 2>&1 | tee Artifacts/xcodebuild.log

      # Always surface the log tail (even on timeout/cancel) so a remote agent
      # can diagnose hangs without authenticated API access.
      - name: Publish diagnostics
        if: always()
        run: |
          {
            echo "### xcodebuild errors"
            echo '```'
            grep -E "error:" Artifacts/xcodebuild*.log 2>/dev/null | head -50 || true
            echo '```'
            echo "### Build log tail"
            echo '```'
            tail -40 Artifacts/xcodebuild-build.log 2>/dev/null || true
            echo '```'
            echo "### Test log tail"
            echo '```'
            tail -60 Artifacts/xcodebuild.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" Artifacts/xcodebuild*.log 2>/dev/null | head -25 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Simulator screenshot
        if: always()
        run: |
          mkdir -p Artifacts
          xcrun simctl io "$FOCUSTUBE_SIMULATOR_UDID" screenshot Artifacts/final-simulator.png || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focustube-ios-ci
          path: Artifacts/
          if-no-files-found: warn
