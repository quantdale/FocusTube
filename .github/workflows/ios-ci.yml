name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Run opt-in live YouTube extraction/download smokes"
        type: boolean
        default: false

# Only run one iOS CI at a time; new pushes cancel older in-progress runs.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Test FocusTubeCore
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project FocusTube.xcodeproj -scheme FocusTube

      - name: Select and boot simulator
        run: |
          UDID="$(bash scripts/ci/select-simulator.sh | tail -n 1)"
          echo "FOCUSTUBE_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Compile-only pass: catches Swift errors fast without simulator overhead.
      - name: Build (Debug)
        run: |
          mkdir -p Artifacts
          set -o pipefail
          xcodebuild build             -project FocusTube.xcodeproj             -scheme FocusTube             -destination "platform=iOS Simulator,id=${FOCUSTUBE_SIMULATOR_UDID}"             CODE_SIGNING_ALLOWED=NO 2>&1 | tee Artifacts/xcodebuild-build.log

      # Release configuration must compile independently (RELEASE_CONFIDENCE_V1
      # Wave 13): proves optimization settings, the absence of DEBUG-only test
      # fixtures, and release signing-exempt packaging all stay healthy.
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build             -project FocusTube.xcodeproj             -scheme FocusTube             -configuration Release             -destination "platform=iOS Simulator,id=${FOCUSTUBE_SIMULATOR_UDID}"             CODE_SIGNING_ALLOWED=NO 2>&1 | tee Artifacts/xcodebuild-release.log

      # App-hosted unit tests, bounded per test so one hung test cannot eat the
      # job. A watchdog emits the last observed test line as an annotation while
      # the step runs, because remote agents cannot read Actions logs without
      # authentication but CAN read check-run annotations.
      - name: Unit tests (FocusTubeTests)
        timeout-minutes: 20
        continue-on-error: true
        env:
          # Opt-in live smokes (real YouTube extraction/download) run only on a
          # manual dispatch with live_smoke=true; push/PR runs stay deterministic.
          FOCUSTUBE_LIVE_SMOKE: ${{ inputs.live_smoke == true && '1' || '0' }}
        run: |
          mkdir -p Artifacts
          set -o pipefail
          xcodebuild test             -project FocusTube.xcodeproj             -scheme FocusTube             -destination "platform=iOS Simulator,id=${FOCUSTUBE_SIMULATOR_UDID}"             -only-testing:FocusTubeTests             -test-timeouts-enabled YES             -default-test-execution-time-allowance 180             -resultBundlePath Artifacts/UnitTests.xcresult             CODE_SIGNING_ALLOWED=NO 2>&1 | tee Artifacts/xcodebuild-unit.log &
          XPID=$!
          LAST=""
          COUNT=0
          while kill -0 "$XPID" 2>/dev/null; do
            sleep 45
            CUR="$(grep -E "Test Case .* (started|passed|failed)|Test Suite .* (started|passed|failed)|error:" Artifacts/xcodebuild-unit.log 2>/dev/null | tail -1 || true)"
            if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ] && [ "$COUNT" -lt 9 ]; then
              echo "::warning::unit-progress: $CUR"
              LAST="$CUR"
              COUNT=$((COUNT+1))
            fi
          done
          RC=0
          wait "$XPID" || RC=$?
          echo "$RC" > Artifacts/unit.exit
          exit $RC

      # UI tests in their own bounded step so a hang in either bundle leaves the
      # other bundle's verdict intact.
      - name: UI tests (FocusTubeUITests)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          mkdir -p Artifacts
          set -o pipefail
          xcodebuild test             -project FocusTube.xcodeproj             -scheme FocusTube             -destination "platform=iOS Simulator,id=${FOCUSTUBE_SIMULATOR_UDID}"             -only-testing:FocusTubeUITests             -test-timeouts-enabled YES             -default-test-execution-time-allowance 180             -resultBundlePath Artifacts/UITests.xcresult             CODE_SIGNING_ALLOWED=NO 2>&1 | tee Artifacts/xcodebuild-ui.log &
          XPID=$!
          LAST=""
          COUNT=0
          while kill -0 "$XPID" 2>/dev/null; do
            sleep 45
            CUR="$(grep -E "Test Case .* (started|passed|failed)|Test Suite .* (started|passed|failed)|error:" Artifacts/xcodebuild-ui.log 2>/dev/null | tail -1 || true)"
            if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ] && [ "$COUNT" -lt 9 ]; then
              echo "::warning::ui-progress: $CUR"
              LAST="$CUR"
              COUNT=$((COUNT+1))
            fi
          done
          RC=0
          wait "$XPID" || RC=$?
          echo "$RC" > Artifacts/ui.exit
          exit $RC

      # Always surface diagnostics (even on timeout/cancel) so a remote agent
      # can diagnose hangs without authenticated API access. Log tails are
      # emitted as multi-line warning annotations; failures as error annotations.
      - name: Publish diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib

          def tail_annotation(label: str, path: str, lines: int = 12) -> None:
              p = pathlib.Path(path)
              if not p.exists():
                  return
              text = "".join(p.read_text(errors="replace").splitlines(keepends=True)[-lines:])
              enc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              if enc.strip():
                  print(f"::warning::{label} log tail:%0A{enc}")

          tail_annotation("unit", "Artifacts/xcodebuild-unit.log")
          tail_annotation("ui", "Artifacts/xcodebuild-ui.log")
          tail_annotation("build", "Artifacts/xcodebuild-build.log")
          tail_annotation("release", "Artifacts/xcodebuild-release.log")
          PY
          {
            echo "### xcodebuild errors"
            echo '```'
            grep -E "error:" Artifacts/xcodebuild*.log 2>/dev/null | head -50 || true
            echo '```'
            echo "### Build log tail"
            echo '```'
            tail -40 Artifacts/xcodebuild-build.log 2>/dev/null || true
            echo '```'
            echo "### Release log tail"
            echo '```'
            tail -40 Artifacts/xcodebuild-release.log 2>/dev/null || true
            echo '```'
            echo "### Unit log tail"
            echo '```'
            tail -60 Artifacts/xcodebuild-unit.log 2>/dev/null || true
            echo '```'
            echo "### UI log tail"
            echo '```'
            tail -60 Artifacts/xcodebuild-ui.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- XCTest assertion failures ---"
          grep -E "error: -\[" Artifacts/xcodebuild-unit.log 2>/dev/null | head -25 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          grep -E -A6 "Failing tests:" Artifacts/xcodebuild-unit.log 2>/dev/null | head -12 | while IFS= read -r line; do
            echo "::notice::$line"
          done || true
          grep -E "error:" Artifacts/xcodebuild*.log 2>/dev/null | head -5 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      # Structural regression guard: the test steps above run under
      # continue-on-error so both bundles always execute and diagnostics always
      # publish; this checks the honest fail-closed Gate contract survived any
      # workflow edits (a weakened gate must fail CI, not pass silently).
      - name: Gate contract self-check
        if: always()
        run: bash scripts/ci/verify-gate-contract.sh

      # continue-on-error on the test steps exists only to guarantee both bundles
      # always run and diagnostics publish; this gate restores an honest verdict.
      - name: Gate
        if: always()
        run: |
          U="$(cat Artifacts/unit.exit 2>/dev/null || echo missing)"
          I="$(cat Artifacts/ui.exit 2>/dev/null || echo missing)"
          echo "unit exit: $U / ui exit: $I"
          if [ "$U" != "0" ] || [ "$I" != "0" ]; then
            echo "::error::iOS CI gate failed (unit=$U ui=$I)"
            exit 1
          fi

      - name: Simulator screenshot
        if: always()
        run: |
          mkdir -p Artifacts
          xcrun simctl io "$FOCUSTUBE_SIMULATOR_UDID" screenshot Artifacts/final-simulator.png || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focustube-ios-ci
          path: Artifacts/
          if-no-files-found: warn
