---
name: Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test FocusTubeCore
        run: swift test 2>&1 | tee /tmp/core-build.log || true

      - name: Push diagnostic log
        if: always()
        run: |
          mkdir -p ci-diag
          cp /tmp/core-build.log ci-diag/core-err.txt
          git config user.name "ci-diag"
          git config user.email "ci-diag@local"
          git add -A
          git commit -m "diag: core build log" || echo "nothing to commit"
          git push origin HEAD:ci-diag || echo "push failed"
