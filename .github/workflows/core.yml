---
name: Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test FocusTubeCore
        run: swift test 2>&1 | tee /tmp/core-build.log || true

      - name: Publish diagnostic
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "error:" /tmp/core-build.log; then
            BODY=$(head -c 9000 /tmp/core-build.log \
              | python3 -c "import sys,json;print(json.dumps(sys.stdin.read()))")
            curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"title\":\"CI diag build error\",\"body\":$BODY}" \
              https://api.github.com/repos/quantdale/FocusTube/issues \
              || echo "issue create failed"
          else
            echo "no compiler error found in log"
          fi
