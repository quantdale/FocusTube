---
name: Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test FocusTubeCore
        run: swift test 2>&1 | tee /tmp/core-build.log || true

      - name: Publish diagnostic
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh gist create /tmp/core-build.log -p -d "core-build-log" \
            || echo "gist create failed"
