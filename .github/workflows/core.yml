---
name: Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test FocusTubeCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/core-test.log

      # The Actions log API needs auth to read remotely; the step summary renders
      # on the public run page and ::error:: lines become readable annotations.
      - name: Publish failure summary
        if: failure()
        run: |
          {
            echo "### FocusTubeCore swift test output"
            echo '```'
            grep -E "error:" /tmp/core-test.log | head -100 || true
            echo '```'
            echo "### Tail"
            echo '```'
            tail -80 /tmp/core-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" /tmp/core-test.log | head -25 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
